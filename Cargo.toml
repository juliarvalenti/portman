[workspace]
resolver = "2"
members = ["crates/portman-core", "crates/portman-cli", "app/src-tauri"]
# `cargo build` at the root builds the CLI only; the app builds via `npm run tauri`.
default-members = ["crates/portman-core", "crates/portman-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Julia Valenti"]
license = "MIT"

[workspace.dependencies]
portman-core = { path = "crates/portman-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
